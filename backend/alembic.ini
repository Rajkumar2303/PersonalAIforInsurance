# Alembic configuration for the Ontario All-Quote Agent backend.
# The durable evidence/audit store (Issue #10) uses the async SQLAlchemy engine.
# Production URL is Postgres (asyncpg); the hermetic migration test overrides
# ``sqlalchemy.url`` with a temp SQLite (aiosqlite) URL.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Default URL - overridden by the migration test and by DATABASE_URL usage.
sqlalchemy.url = sqlite+aiosqlite:///./evidence.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
